name: Deploy Ascensao do Saber PWA
on:
  push:
    branches: [main]
    paths:
      - 'Ascensao-do-Saber-PWA-GitHub.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract application
        run: |
          unzip -q Ascensao-do-Saber-PWA-GitHub.zip -d source
          APP_PACKAGE="$(find source -name package.json -not -path '*/node_modules/*' -print -quit)"
          test -n "$APP_PACKAGE"
          APP_DIR="$(dirname "$APP_PACKAGE")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
      - name: Install and build
        id: build
        run: |
          cd "$APP_DIR"
          npm ci
          npm run build
          echo "dist_path=$APP_DIR/dist" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.dist_path }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
