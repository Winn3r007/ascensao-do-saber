name: Deploy Ascensao do Saber PWA
on:
  push:
    branches: [main]
    paths:
      - 'Ascensao-do-Saber-PWA-GitHub.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: false
      - name: Extract application
        run: |
          unzip -q Ascensao-do-Saber-PWA-GitHub.zip -d source
          test -f source/ascensao-do-saber/package.json
      - name: Install and build
        working-directory: source/ascensao-do-saber
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/ascensao-do-saber/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
